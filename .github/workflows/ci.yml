# .github/workflows/ci.yml
name: CI                      # the name shown in the Actions tab

on:                           # triggers: when should this run?
  push:
    branches: [master]          # every push to main
  pull_request:
    branches: [master]          # every PR that targets main

jobs:
  test:                       # the job's id; you choose the name
    runs-on: ubuntu-latest    # a fresh Ubuntu Linux machine from GitHub
    env:                      # env vars for every step in this job
      # app/db.py needs DATABASE_URL to exist on import; /health never connects to it
      DATABASE_URL: postgresql://launchpulse:devpassword@127.0.0.1:5432/launchpulse

    steps:
      - name: Check out the code
        uses: actions/checkout@v7       # copies your repo onto the runner

      - name: Set up Python 3.12
        uses: actions/setup-python@v7   # installs that Python version
        with:
          python-version: "3.12"        # in quotes, so YAML doesn't treat it as a number
          cache: pip                    # reuse downloaded packages between runs (faster)

      - name: Install dependencies
        run: pip install -r requirements.txt   # pytest is in requirements.txt

      - name: Run tests
        run: pytest -q                  # any failing test fails the step and turns the run red